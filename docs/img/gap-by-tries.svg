<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">The more times you ask, the wider the gap</title>
<desc id="d">For the normal 7B AI, asked once, both measures are 42.9%. Asked twice: 45.5% right at least once, 40.4% right both times. Asked five times: 48.2% versus 37.7%. Asked ten times: 49.8% versus 36.1%, a gap of 13.7 points. Most of the gap appears within the first three tries.</desc>
<style>
  .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
  .t1{fill:#0b0b0b}.t2{fill:#52514e}.mu{fill:#898781}
  .grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}
  .can{stroke:#2a78d6}.canf{fill:#2a78d6}.every{stroke:#eb6834}.everyf{fill:#eb6834}
  .band{fill:#898781;fill-opacity:.14}.ring{stroke:#fcfcfb}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
    .t1{fill:#ffffff}.t2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a}.base{stroke:#383835}
    .can{stroke:#3987e5}.canf{fill:#3987e5}.every{stroke:#d95926}.everyf{fill:#d95926}
    .band{fill:#c3c2b7;fill-opacity:.12}.ring{stroke:#1a1a19}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="359" rx="12"/>
<text class="t1" x="28" y="42" font-size="20" font-weight="600">Ask more times, and the gap opens up</text>
<text class="t2" x="28" y="66" font-size="14">Normal AI (7B). A leaderboard asks once, where the two lines still touch.</text>
<circle class="everyf" cx="34" cy="94" r="6"/><text class="t2" x="46" y="99" font-size="13">Right every time</text>
<circle class="canf" cx="180" cy="94" r="6"/><text class="t2" x="192" y="99" font-size="13">Right at least once</text>
<line class="base" x1="84" y1="300.0" x2="628" y2="300.0" stroke-width="1"/>
<text class="mu" x="74" y="304.0" font-size="12" text-anchor="end">30%</text>
<line class="grid" x1="84" y1="264.0" x2="628" y2="264.0" stroke-width="1"/>
<text class="mu" x="74" y="268.0" font-size="12" text-anchor="end">35%</text>
<line class="grid" x1="84" y1="228.0" x2="628" y2="228.0" stroke-width="1"/>
<text class="mu" x="74" y="232.0" font-size="12" text-anchor="end">40%</text>
<line class="grid" x1="84" y1="192.0" x2="628" y2="192.0" stroke-width="1"/>
<text class="mu" x="74" y="196.0" font-size="12" text-anchor="end">45%</text>
<line class="grid" x1="84" y1="156.0" x2="628" y2="156.0" stroke-width="1"/>
<text class="mu" x="74" y="160.0" font-size="12" text-anchor="end">50%</text>
<line class="grid" x1="84" y1="120.0" x2="628" y2="120.0" stroke-width="1"/>
<text class="mu" x="74" y="124.0" font-size="12" text-anchor="end">55%</text>
<text class="mu" x="84.0" y="322" font-size="12" text-anchor="middle">1</text>
<text class="mu" x="144.4" y="322" font-size="12" text-anchor="middle">2</text>
<text class="mu" x="204.9" y="322" font-size="12" text-anchor="middle">3</text>
<text class="mu" x="265.3" y="322" font-size="12" text-anchor="middle">4</text>
<text class="mu" x="325.8" y="322" font-size="12" text-anchor="middle">5</text>
<text class="mu" x="386.2" y="322" font-size="12" text-anchor="middle">6</text>
<text class="mu" x="446.7" y="322" font-size="12" text-anchor="middle">7</text>
<text class="mu" x="507.1" y="322" font-size="12" text-anchor="middle">8</text>
<text class="mu" x="567.6" y="322" font-size="12" text-anchor="middle">9</text>
<text class="mu" x="628.0" y="322" font-size="12" text-anchor="middle">10</text>
<text class="mu" x="356.0" y="344" font-size="12" text-anchor="middle">number of times the same question is asked</text>
<polygon class="band" points="84.0,207.1 144.4,188.4 204.9,179.0 265.3,173.3 325.8,169.0 386.2,165.4 446.7,162.5 507.1,160.3 567.6,158.9 628.0,157.4 628.0,256.1 567.6,254.6 507.1,252.5 446.7,250.3 386.2,248.2 325.8,244.6 265.3,240.2 204.9,234.5 144.4,225.1 84.0,207.1"/>
<polyline class="can" points="84.0,207.1 144.4,188.4 204.9,179.0 265.3,173.3 325.8,169.0 386.2,165.4 446.7,162.5 507.1,160.3 567.6,158.9 628.0,157.4" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline class="every" points="84.0,207.1 144.4,225.1 204.9,234.5 265.3,240.2 325.8,244.6 386.2,248.2 446.7,250.3 507.1,252.5 567.6,254.6 628.0,256.1" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="everyf ring" cx="84.0" cy="207.1" r="5" stroke-width="2"/>
<circle class="canf ring" cx="144.4" cy="188.4" r="5" stroke-width="2"/>
<circle class="everyf ring" cx="144.4" cy="225.1" r="5" stroke-width="2"/>
<circle class="canf ring" cx="325.8" cy="169.0" r="5" stroke-width="2"/>
<circle class="everyf ring" cx="325.8" cy="244.6" r="5" stroke-width="2"/>
<circle class="canf ring" cx="628.0" cy="157.4" r="5" stroke-width="2"/>
<circle class="everyf ring" cx="628.0" cy="256.1" r="5" stroke-width="2"/>
<text class="t2" x="165.6" y="211.1" font-size="12">&#8592; both 42.9% when asked once</text>
<text class="t2" x="144.4" y="176.4" font-size="12" text-anchor="middle">45.5%</text>
<text class="t2" x="144.4" y="247.1" font-size="12" text-anchor="middle">40.4%</text>
<text class="t2" x="325.8" y="157.0" font-size="12" text-anchor="middle">48.2%</text>
<text class="t2" x="325.8" y="266.6" font-size="12" text-anchor="middle">37.7%</text>
<text class="t2" x="640.0" y="161.4" font-size="12">49.8%</text>
<text class="t2" x="640.0" y="260.1" font-size="12">36.1%</text>
<text class="t1" x="690.0" y="204.8" font-size="13" font-weight="600">gap 13.7</text>
<text class="mu" x="690.0" y="221.8" font-size="11.5">at 10 tries</text>
