<line class="gapline" x1="550.8" y1="254" x2="550.8" y2="284" stroke-width="2"/>
</g>
<text class="ink-fixed" x="330.6" y="274" font-size="13" font-weight="600" text-anchor="middle">30%</text>
<text class="on-dark" x="475.0" y="274" font-size="13" font-weight="600" text-anchor="middle">33%</text>
