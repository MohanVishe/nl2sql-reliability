<line class="gapline" x1="685.2" y1="196" x2="685.2" y2="226" stroke-width="2"/>
</g>
<text class="ink-fixed" x="369.2" y="216" font-size="13" font-weight="600" text-anchor="middle">46%</text>
<text class="on-dark" x="580.8" y="216" font-size="13" font-weight="600" text-anchor="middle">45%</text>
<text class="on-light" x="704.6" y="216" font-size="13" font-weight="600" text-anchor="middle">8%</text>
<text class="t1" x="28" y="267" font-size="15" font-weight="600">Smaller AI</text>
