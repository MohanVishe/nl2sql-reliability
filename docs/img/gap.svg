<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
<title id="t">What the AI can do versus what it does every time</title>
<desc id="d">Normal AI: right at least once in 10 tries on 49.8% of questions, right all 10 times on 36.1%, a gap of 13.7 points. AI that retries on error: 54.2% versus 39.5%, gap 14.7. Smaller AI: 42.3% versus 18.8%, gap 23.6.</desc>
<style>
  .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
  .t1{fill:#0b0b0b}.t2{fill:#52514e}.mu{fill:#898781}
  .grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.gap{stroke:#c3c2b7}
  .can{fill:#2a78d6}.every{fill:#eb6834}.ring{stroke:#fcfcfb}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
    .t1{fill:#ffffff}.t2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a}.base{stroke:#383835}.gap{stroke:#4a4a46}
    .can{fill:#3987e5}.every{fill:#d95926}.ring{stroke:#1a1a19}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="339" rx="12"/>
<text class="t1" x="28" y="42" font-size="20" font-weight="600">The gap: what the AI <tspan font-style="italic">can</tspan> do vs. what it does <tspan font-style="italic">every time</tspan></text>
<text class="t2" x="28" y="66" font-size="14">496 database questions, each asked 10 times. Longer line = less reliable.</text>
<circle class="every" cx="34" cy="96" r="6"/>
<text class="t2" x="46" y="101" font-size="13">Right all 10 times (reliable)</text>
<circle class="can" cx="254" cy="96" r="6"/>
<text class="t2" x="266" y="101" font-size="13">Right at least once (capable)</text>
<line class="base" x1="262.0" y1="124" x2="262.0" y2="300" stroke-width="1"/>
<text class="mu" x="262.0" y="320" font-size="12" text-anchor="middle">0%</text>
<line class="grid" x1="416.0" y1="124" x2="416.0" y2="300" stroke-width="1"/>
<text class="mu" x="416.0" y="320" font-size="12" text-anchor="middle">20%</text>
<line class="grid" x1="570.0" y1="124" x2="570.0" y2="300" stroke-width="1"/>
<text class="mu" x="570.0" y="320" font-size="12" text-anchor="middle">40%</text>
<line class="grid" x1="724.0" y1="124" x2="724.0" y2="300" stroke-width="1"/>
<text class="mu" x="724.0" y="320" font-size="12" text-anchor="middle">60%</text>
<text class="t1" x="28" y="146" font-size="15" font-weight="600">Normal AI</text>
<text class="mu" x="28" y="164" font-size="12">Qwen2.5-Coder 7B, one try</text>
<line class="gap" x1="540.0" y1="148" x2="645.5" y2="148" stroke-width="6" stroke-linecap="round"/>
<text class="t1" x="592.7" y="136" font-size="12.5" font-weight="600" text-anchor="middle">gap 13.7</text>
<circle class="every ring" cx="540.0" cy="148" r="8" stroke-width="2"/>
<circle class="can ring" cx="645.5" cy="148" r="8" stroke-width="2"/>
<text class="t2" x="540.0" y="174" font-size="12" text-anchor="middle">36.1%</text>
<text class="t2" x="645.5" y="174" font-size="12" text-anchor="middle">49.8%</text>
<text class="t1" x="28" y="210" font-size="15" font-weight="600">AI that retries on error</text>
<text class="mu" x="28" y="228" font-size="12">same model, up to 3 tries</text>
<line class="gap" x1="566.1" y1="212" x2="679.3" y2="212" stroke-width="6" stroke-linecap="round"/>
<text class="t1" x="622.7" y="200" font-size="12.5" font-weight="600" text-anchor="middle">gap 14.7</text>
<circle class="every ring" cx="566.1" cy="212" r="8" stroke-width="2"/>
<circle class="can ring" cx="679.3" cy="212" r="8" stroke-width="2"/>
<text class="t2" x="566.1" y="238" font-size="12" text-anchor="middle">39.5%</text>
<text class="t2" x="679.3" y="238" font-size="12" text-anchor="middle">54.2%</text>
<text class="t1" x="28" y="274" font-size="15" font-weight="600">Smaller AI</text>
<text class="mu" x="28" y="292" font-size="12">Qwen2.5-Coder 3B, one try</text>
<line class="gap" x1="406.8" y1="276" x2="587.7" y2="276" stroke-width="6" stroke-linecap="round"/>
<text class="t1" x="497.2" y="264" font-size="12.5" font-weight="600" text-anchor="middle">gap 23.6</text>
<circle class="every ring" cx="406.8" cy="276" r="8" stroke-width="2"/>
<circle class="can ring" cx="587.7" cy="276" r="8" stroke-width="2"/>
<text class="t2" x="406.8" y="302" font-size="12" text-anchor="middle">18.8%</text>
<text class="t2" x="587.7" y="302" font-size="12" text-anchor="middle">42.3%</text>
</svg>
