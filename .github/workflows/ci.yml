name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Installs exactly what uv.lock pins, and fails if the lock no longer matches
      # pyproject.toml. The dev extra carries pytest and ruff, so `uv run` uses these and
      # never falls through to a system-wide copy.
      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Network and database tests are deselected: CI must not fail because an
      # upstream host is briefly unreachable, and the 346 MB BIRD archive is not fetched in CI.
      # Both groups run locally with `uv run pytest`.
      - name: Test
        run: uv run pytest -m "not network and not databases"
